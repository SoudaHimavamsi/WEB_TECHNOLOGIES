<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Book Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Library Book Tracker (XML DOM)</h2>
    <div id="message" style="font-weight: bold; margin-bottom: 10px;"></div>

    <h3>Add New Book</h3>
    <form id="bookForm">
        <input type="text" id="bookId" placeholder="Book ID" required>
        <input type="text" id="bookTitle" placeholder="Title" required>
        <input type="text" id="bookAuthor" placeholder="Author" required>
        <select id="bookStatus">
            <option value="Available">Available</option>
            <option value="Checked Out">Checked Out</option>
            <option value="Lost">Lost</option>
        </select>
        <button type="button" onclick="addBook()">Add Book</button>
    </form>

    <h3>Book Inventory</h3>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="bookTableBody">
            </tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
