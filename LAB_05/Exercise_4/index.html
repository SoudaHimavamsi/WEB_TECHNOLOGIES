<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory System</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* A little extra inline CSS for the low stock warning and layout */
        .low-stock {
            background-color: #ffcccc !important; /* Light red background for low stock */
            color: #900;
            font-weight: bold;
        }
        .dashboard {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: #fff;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            flex: 1;
        }
    </style>
</head>
<body>
    <h2>Product Inventory System</h2>
    <div id="message" style="font-weight: bold; margin-bottom: 10px;"></div>

    <div class="dashboard">
        <div class="card">
            <h3>Add / Update Product</h3>
            <form id="productForm">
                <input type="hidden" id="editIndex" value="-1">
                <input type="text" id="prodId" placeholder="Product ID" required style="margin-bottom:10px;"><br>
                <input type="text" id="prodName" placeholder="Name" required style="margin-bottom:10px;"><br>
                <input type="text" id="prodCategory" placeholder="Category" required style="margin-bottom:10px;"><br>
                <input type="number" id="prodPrice" placeholder="Price" step="0.01" required style="margin-bottom:10px;"><br>
                <input type="number" id="prodStock" placeholder="Stock Quantity" required style="margin-bottom:10px;"><br>
                <button type="button" onclick="saveProduct()">Save Product</button>
            </form>
        </div>

        <div class="card">
            <h3>Search Inventory</h3>
            <input type="text" id="searchCategory" placeholder="Search by Category..." onkeyup="searchByCategory()" style="width: 80%;">
            
            <h3>Inventory Statistics</h3>
            <p style="font-size: 1.2em;"><strong>Total Value: </strong>$<span id="totalValue">0.00</span></p>
            <p style="color: #dc3545; font-size: 0.9em;">* Rows highlighted in red have low stock (5 or less).</p>
        </div>
    </div>

    <h3>Product List</h3>
    <table border="1" style="width: 100%; text-align: left;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price ($)</th>
                <th>Stock</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="inventoryTableBody">
            </tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
